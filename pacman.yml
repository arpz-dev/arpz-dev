name: generate breakout contribution graphs

on:
  # Se ejecuta automáticamente cada 24 horas
  schedule:
    - cron: "0 0 * * *"
  # Permite ejecutarlo manualmente desde la pestaña Actions
  workflow_dispatch:
  # Se ejecuta en cada push a la rama principal
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # Genera las imágenes del juego Breakout
      - name: generate breakout-contribution-graph.svg
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          games: "breakout"

      # Renombra los archivos generados al formato que espera tu README y los mueve a dist
      - name: prepare output files
        run: |
          mkdir -p dist
          cp output/breakout-contribution-graph.svg dist/breakout-contribution-graph.svg
          cp output/breakout-contribution-graph-dark.svg dist/breakout-contribution-graph-dark.svg

      # Sube los archivos a la rama pacman-output
      - name: push SVGs to the pacman-output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: pacman-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
