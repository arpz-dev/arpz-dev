name: Generate profile cards

on:
  push:
    branches: [main]
    paths:
      - scripts/generate_cards.py
      - .github/workflows/generate-cards.yml
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-cards
  cancel-in-progress: true

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate cards
        run: python scripts/generate_cards.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: arpz-dev

      - name: List generated files
        run: ls -la assets

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg README.md
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "chore: update profile cards"
            git pull --rebase
            git push
          fi
