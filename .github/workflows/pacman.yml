name: generate arcade contribution graphs

on:
  schedule: # se ejecuta automáticamente cada 24 horas
    - cron: '0 0 * * *'
  workflow_dispatch: # permite ejecutarlo manualmente desde la pestaña Actions
  push: # se ejecuta en cada push a main
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: generate contribution graph SVGs
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          # Lista de juegos separados por coma (pacman, breakout, galaga, puzzle-bobble, bomberman, minesweeper)
          games: 'breakout'

      # Publica los SVGs generados en la rama pacman-output
      - name: push SVGs to the pacman-output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: pacman-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
