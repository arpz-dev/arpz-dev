name: generate breakout animation

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: generate breakout SVG
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: ${{ github.repository_owner }}
          template: classic
          base: ""
          plugin_isometric: no
          plugin_languages: no

      # Alternativa nativa sin depender de compilación compleja:
      # Descarga directa del renderer de Profile Readme Generator
      - name: generate breakout grid
        run: |
          mkdir -p dist
          curl -s "https://profile-readme-generator.com/api/breakout?username=${{ github.repository_owner }}" -o dist/breakout-contribution-graph.svg
          curl -s "https://profile-readme-generator.com/api/breakout?username=${{ github.repository_owner }}&theme=dark" -o dist/breakout-contribution-graph-dark.svg

      - name: push animation to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: pacman-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
